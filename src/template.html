<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Explorer 3D</title>
<meta name="description" content="มาสคอตนักสำรวจ 3 มิติ น่ารัก หมุน ซูม และแตะให้กระโดดได้">
<style>
  :root { --ink: #5b4636; --muted: #a08b7b; --chip: rgba(255,255,255,.86); --line: rgba(91,70,54,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #ffffff; color: var(--ink);
    font-family: "Prompt", "Noto Sans Thai", "Sukhumvit Set", system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab;
    opacity: 0; transition: opacity .6s ease; }
  #app canvas:active { cursor: grabbing; }
  body.ready #app canvas { opacity: 1; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .hint { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    font-size: 12.5px; color: var(--muted); background: var(--chip); border: 1px solid var(--line);
    padding: 7px 14px; border-radius: 999px; white-space: nowrap; }
  @media (max-width: 520px) { .hint { font-size: 11.5px; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div class="hint">ลากเพื่อหมุน · ซูมได้ · แตะตัวน้องให้กระโดด</div>
</div>
<script type="module">/*__BUNDLE__*/</script>
</body>
</html>
