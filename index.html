<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Explorer 3D</title>
<meta name="description" content="มาสคอตนักสำรวจ 3 มิติ น่ารัก หมุน ซูม และแตะให้กระโดดได้">
<style>
  :root { --ink: #5b4636; --muted: #a08b7b; --chip: rgba(255,255,255,.86); --line: rgba(91,70,54,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #ffffff; color: var(--ink);
    font-family: "Prompt", "Noto Sans Thai", "Sukhumvit Set", system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab;
    opacity: 0; transition: opacity .6s ease; }
  #app canvas:active { cursor: grabbing; }
  body.ready #app canvas { opacity: 1; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .title { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; }
  .title h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .02em; }
  .title p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .hint { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    font-size: 12.5px; color: var(--muted); background: var(--chip); border: 1px solid var(--line);
    padding: 7px 14px; border-radius: 999px; white-space: nowrap; }
  .quality { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px; display: flex; flex-direction: column;
    align-items: flex-end; gap: 6px; pointer-events: auto; font-size: 12px; }
  .quality .seg { display: flex; background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .quality button { font: inherit; color: var(--muted); background: none; border: 0; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
  .quality button.on { background: #fff3e2; color: var(--ink); font-weight: 600; }
  #quality, #fps { color: var(--muted); }
  #fps { display: none; font-variant-numeric: tabular-nums; }
  #hud.show-fps #fps { display: block; }
  @media (max-width: 520px) { .hint { font-size: 11.5px; } .title h1 { font-size: 16px; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div class="title"><h1>Little Explorer</h1><p>น้องนักสำรวจตัวกลม</p></div>
  <div class="quality">
    <div class="seg">
      <button data-q="auto">อัตโนมัติ</button><button data-q="high">สูง</button><button data-q="medium">กลาง</button><button data-q="low">ประหยัด</button>
    </div>
    <span id="quality"></span>
    <span id="fps"></span>
  </div>
  <div class="hint">ลากเพื่อหมุน · ซูมได้ · แตะตัวน้องให้กระโดด</div>
</div>
